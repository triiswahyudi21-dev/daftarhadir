<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Daftar Hadir Realtime</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1200px;
            background: white;
            padding: 25px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header-title {
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: UPPERCASE;
        }
        .info-sekolah table {
            border: none;
            width: auto;
            margin-bottom: 20px;
            line-height: 1.0; 
            border-collapse: collapse;
        }
        .info-sekolah td {
            padding: 3px 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
        }
        .info-sekolah input, .info-sekolah select {
            padding: 2px 5px;
            font-size: 14px;
        }
        .form-container {
            background-color: #e9ecef;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .form-group {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            vertical-align: top;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        input, select, textarea, button {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
        }
        textarea {
            resize: vertical;
            height: 45px;
            width: 250px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 7px 12px;
        }
        button:hover {
            background-color: #218838;
        }
        table.daftar-hadir {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table.daftar-hadir th, table.daftar-hadir td {
            border: 1px solid #000;
            padding: 4px;
            text-align: center;
            font-size: 12px;
            vertical-align: middle;
        }
        table.daftar-hadir th {
            background-color: #e0e0e0;
        }
        .status-select {
            width: 100%;
            font-size: 11px;
            padding: 1px 0;
            font-weight: bold;
            text-align: center;
            text-align-last: center;
            -moz-text-align-last: center;
        }
        .status-select option {
            text-align: center;
        }
        .nama-col {
            text-align: left !important;
            white-space: nowrap;
        }
        .rekap-col {
            background-color: #f8f9fa;
            font-weight: bold;
            min-width: 28px;
        }
        .hint {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        /* KHUSUS CETAK / PRINT / PDF */
        @media print {
            .form-container { display: none; }
            
            .info-sekolah input, 
            .info-sekolah select {
                border: none !important;
                outline: none !important;
                background: transparent !important;
                appearance: none !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                padding: 0 !important;
                font-weight: bold;
                font-size: 14px;
                color: #000;
            }

            .info-sekolah select::-ms-expand {
                display: none;
            }

            .status-select {
                border: none;
                background: transparent;
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
            }
            body { background-color: white; }
            .container { box-shadow: none; padding: 0; }
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div class="header-title">DAFTAR HADIR</div>

    <!-- Header Info -->
    <div class="info-sekolah">
        <table>
            <tr>
                <td>Sekolah</td>
                <td>:</td>
                <td><input type="text" id="inputSekolah" placeholder="Nama Sekolah" onchange="simpanHeaderGlobal()"></td>
            </tr>
            <tr>
                <td>Kelas</td>
                <td>:</td>
                <td>
                    <select id="selectKelas" onchange="gantiKelas()">
                        <option value="8C">8 C</option>
                        <option value="8D">8 D</option>
                        <option value="9A">9 A</option>
                        <option value="9B">9 B</option>
                        <option value="9C">9 C</option>
                        <option value="9D">9 D</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bulan</td>
                <td>:</td>
                <td>
                    <input type="month" id="selectBulan" onchange="gantiBulan()">
                </td>
            </tr>
            <tr>
                <td>Tapel</td>
                <td>:</td>
                <td><input type="text" id="inputTapel" placeholder="2025/2026" onchange="simpanHeaderGlobal()"></td>
            </tr>
            <tr>
                <td>Mapel</td>
                <td>:</td>
                <td><input type="text" id="inputMapel" placeholder="Mata Pelajaran" onchange="simpanMapelKelas()"></td>
            </tr>
        </table>
    </div>

    <!-- Panel Input -->
    <div class="form-container">
        <strong>1. IMPORT DATA SISWA (DINAMIS SESUAI JUMLAH EXCEL)</strong>
        <div style="margin-top: 8px;">
            <div class="form-group">
                <label>Paste Data Excel (Nama + JK)</label>
                <textarea id="rawExcel" placeholder="Copy 2 kolom di Excel (Nama & L/P), lalu Paste di sini"></textarea>
                <div class="hint">*Format Excel: Kolom 1 = Nama, Kolom 2 = L/P</div>
            </div>
            <div class="form-group" style="padding-top: 18px;">
                <button onclick="tambahSiswaExcel()">+ Import Siswa</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">

        <strong>2. INPUT TANGGAL PERTEMUAN (AKAN MUNCUL OTOMATIS DI TABEL)</strong>
        <div style="margin-top: 8px;">
            <div class="form-group">
                <label>Pertemuan Ke-</label>
                <input type="number" id="setPertemuanKe" min="1" placeholder="Misal: 1">
            </div>
            <div class="form-group">
                <label>Pilih Tanggal</label>
                <input type="date" id="setTanggalVal">
            </div>
            <div class="form-group" style="padding-top: 18px;">
                <button onclick="setTanggalOtomatis()" style="background-color: #17a2b8;">+ Tambah Pertemuan Ke Tabel</button>
                <button onclick="window.print()" style="background-color: #007bff;">Cetak/Print</button>
                <button onclick="hapusSemuaDataKelas()" style="background-color: #dc3545;">Reset Bulan Ini</button>
            </div>
        </div>
    </div>

    <!-- Tabel Daftar Hadir -->
    <table class="daftar-hadir">
        <thead>
            <tr id="rowHeader1"></tr>
            <tr id="rowHeader2"></tr>
        </thead>
        <tbody id="tabelSiswa"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://daftar-hadir-default-rtdb.firebaseio.com/"
    };
    
    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch(e) {
        console.log("Firebase Offline - Menggunakan LocalStorage");
    }

    let kelasAktif = "8C";
    const today = new Date();
    let bulanAktif = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
    
    // Menyimpan penunjuk listener Firebase yang aktif
    let activeRef = null;

    let headerGlobalInfo = { sekolah: "", tapel: "" };
    let mapelPerKelas = {}; 

    // Tempat menyimpan data terisolasi untuk kelas yang sedang dibuka
    let dataKelas = {
        pertemuanList: [],
        tanggal: {},
        siswa: []
    };

    function initHeaderListeners() {
        if (db) {
            db.ref('info_global').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    headerGlobalInfo = val;
                    document.getElementById("inputSekolah").value = headerGlobalInfo.sekolah || "";
                    document.getElementById("inputTapel").value = headerGlobalInfo.tapel || "";
                }
            });

            db.ref('mapel_kelas').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    mapelPerKelas = val;
                    document.getElementById("inputMapel").value = mapelPerKelas[kelasAktif] || "";
                }
            });
        } else {
            const localGlobal = localStorage.getItem("info_global");
            if (localGlobal) {
                headerGlobalInfo = JSON.parse(localGlobal);
                document.getElementById("inputSekolah").value = headerGlobalInfo.sekolah || "";
                document.getElementById("inputTapel").value = headerGlobalInfo.tapel || "";
            }

            const localMapel = localStorage.getItem("mapel_kelas");
            if (localMapel) {
                mapelPerKelas = JSON.parse(localMapel);
                document.getElementById("inputMapel").value = mapelPerKelas[kelasAktif] || "";
            }
        }
    }

    function simpanHeaderGlobal() {
        headerGlobalInfo.sekolah = document.getElementById("inputSekolah").value;
        headerGlobalInfo.tapel = document.getElementById("inputTapel").value;

        localStorage.setItem("info_global", JSON.stringify(headerGlobalInfo));
        if (db) db.ref('info_global').set(headerGlobalInfo);
    }

    function simpanMapelKelas() {
        mapelPerKelas[kelasAktif] = document.getElementById("inputMapel").value;

        localStorage.setItem("mapel_kelas", JSON.stringify(mapelPerKelas));
        if (db) db.ref('mapel_kelas').set(mapelPerKelas);
    }

    function gantiKelas() {
        kelasAktif = document.getElementById("selectKelas").value;
        document.getElementById("inputMapel").value = mapelPerKelas[kelasAktif] || "";
        
        // Reset memori sementara sebelum memuat data baru
        dataKelas = { pertemuanList: [], tanggal: {}, siswa: [] };
        
        muatDataKelasRealtime();
    }

    function gantiBulan() {
        bulanAktif = document.getElementById("selectBulan").value;
        dataKelas = { pertemuanList: [], tanggal: {}, siswa: [] };
        muatDataKelasRealtime();
    }

    function renderTabel() {
        document.getElementById("selectBulan").value = bulanAktif;

        const listP = dataKelas.pertemuanList || [];
        const tglMap = dataKelas.tanggal || {};

        const rowHeader1 = document.getElementById("rowHeader1");
        const rowHeader2 = document.getElementById("rowHeader2");

        rowHeader1.innerHTML = "";
        rowHeader2.innerHTML = "";

        if (listP.length > 0) {
            rowHeader1.innerHTML = `
                <th rowspan="2" style="width: 4%;">NO</th>
                <th rowspan="2" style="width: 30%;">NAMA</th>
                <th rowspan="2" style="width: 4%;">L/P</th>
                <th colspan="${listP.length}">PERTEMUAN KE-</th>
                <th colspan="4">JUMLAH</th>
            `;

            listP.forEach(p => {
                const tglFormatted = tglMap[p] ? tglMap[p] : "-";
                rowHeader2.innerHTML += `<th style="min-width:40px;">${p}<br><span style="font-weight:normal; font-size:10px;">${tglFormatted}</span></th>`;
            });

            rowHeader2.innerHTML += `
                <th class="rekap-col">H</th>
                <th class="rekap-col">I</th>
                <th class="rekap-col">S</th>
                <th class="rekap-col">A</th>
            `;
        } else {
            rowHeader1.innerHTML = `
                <th style="width: 4%;">NO</th>
                <th style="width: 30%;">NAMA</th>
                <th style="width: 4%;">L/P</th>
                <th class="rekap-col">H</th>
                <th class="rekap-col">I</th>
                <th class="rekap-col">S</th>
                <th class="rekap-col">A</th>
            `;
        }

        const tbody = document.getElementById("tabelSiswa");
        tbody.innerHTML = "";

        if (!dataKelas.siswa || dataKelas.siswa.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${7 + (listP.length || 0)}" style="padding:15px; color:#777;">Belum ada data siswa untuk <strong>Kelas ${kelasAktif}</strong>. Silakan Paste Data Excel dan Klik Import Siswa.</td></tr>`;
            return;
        }

        dataKelas.siswa.forEach((s, i) => {
            let kolomPertemuan = "";
            let totalH = 0, totalI = 0, totalS = 0, totalA = 0;

            listP.forEach(p => {
                const statusVal = (s.kehadiran && s.kehadiran[p]) ? s.kehadiran[p] : "H";
                
                if (statusVal === 'H') totalH++;
                else if (statusVal === 'I') totalI++;
                else if (statusVal === 'S') totalS++;
                else if (statusVal === 'A') totalA++;

                kolomPertemuan += `
                    <td>
                        <select class="status-select" onchange="updateKehadiran(${i}, ${p}, this.value)">
                            <option value="H" ${statusVal === 'H' ? 'selected' : ''}>H</option>
                            <option value="I" ${statusVal === 'I' ? 'selected' : ''}>I</option>
                            <option value="S" ${statusVal === 'S' ? 'selected' : ''}>S</option>
                            <option value="A" ${statusVal === 'A' ? 'selected' : ''}>A</option>
                        </select>
                    </td>
                `;
            });

            tbody.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td class="nama-col">${s.nama}</td>
                    <td>${s.gender}</td>
                    ${kolomPertemuan}
                    <td class="rekap-col">${totalH}</td>
                    <td class="rekap-col">${totalI}</td>
                    <td class="rekap-col">${totalS}</td>
                    <td class="rekap-col">${totalA}</td>
                </tr>
            `;
        });
    }

    function tambahSiswaExcel() {
        const raw = document.getElementById("rawExcel").value.trim();
        if (!raw) return;

        const lines = raw.split(/\r?\n/);
        dataKelas.siswa = [];

        for (let line of lines) {
            const cols = line.split(/\t/);
            const nama = cols[0] ? cols[0].trim() : "";
            let gender = cols[1] ? cols[1].trim().toUpperCase() : "L";

            if (gender.includes("P") || gender.includes("PEREMPUAN")) {
                gender = "P";
            } else {
                gender = "L";
            }

            if (nama !== "") {
                let kehadiranDefault = {};
                (dataKelas.pertemuanList || []).forEach(p => {
                    kehadiranDefault[p] = "H";
                });

                dataKelas.siswa.push({
                    nama: nama,
                    gender: gender,
                    kehadiran: kehadiranDefault
                });
            }
        }

        document.getElementById("rawExcel").value = "";
        simpanKeDatabase();
    }

    function setTanggalOtomatis() {
        const p = parseInt(document.getElementById("setPertemuanKe").value);
        const rawTgl = document.getElementById("setTanggalVal").value;

        if (!p || !rawTgl) {
            alert("Harap isi Nomor Pertemuan dan Tanggal terlebih dahulu!");
            return;
        }

        const t = new Date(rawTgl);
        const formatted = String(t.getDate()).padStart(2, '0') + '/' + String(t.getMonth() + 1).padStart(2, '0');

        if (!dataKelas.pertemuanList) dataKelas.pertemuanList = [];
        if (!dataKelas.tanggal) dataKelas.tanggal = {};

        if (!dataKelas.pertemuanList.includes(p)) {
            dataKelas.pertemuanList.push(p);
            dataKelas.pertemuanList.sort((a, b) => a - b);
        }

        dataKelas.tanggal[p] = formatted;

        if (dataKelas.siswa && dataKelas.siswa.length > 0) {
            dataKelas.siswa.forEach(s => {
                if (!s.kehadiran) s.kehadiran = {};
                if (!s.kehadiran[p]) s.kehadiran[p] = "H";
            });
        }

        document.getElementById("setPertemuanKe").value = "";
        simpanKeDatabase();
    }

    function updateKehadiran(indexSiswa, p, val) {
        if (!dataKelas.siswa[indexSiswa]) return;
        if (!dataKelas.siswa[indexSiswa].kehadiran) dataKelas.siswa[indexSiswa].kehadiran = {};
        dataKelas.siswa[indexSiswa].kehadiran[p] = val;
        simpanKeDatabase();
    }

    function simpanKeDatabase() {
        const key = `daftar_hadir_${kelasAktif}_${bulanAktif}`;
        localStorage.setItem(key, JSON.stringify(dataKelas));
        
        // Simpan langsung pada path unik kelas dan bulan
        if (db) {
            db.ref(`absensi/${kelasAktif}/${bulanAktif}`).set(dataKelas);
        }
    }

    function muatDataKelasRealtime() {
        // Lepas/Matikan koneksi listener Firebase dari kelas sebelumnya
        if (activeRef) {
            activeRef.off();
            activeRef = null;
        }

        if (db) {
            activeRef = db.ref(`absensi/${kelasAktif}/${bulanAktif}`);
            activeRef.on('value', (snapshot) => {
                const val = snapshot.val();
                
                // Pastikan struktur tersimpan terpisah untuk setiap kelas
                if (val) {
                    dataKelas = val;
                    if (!dataKelas.siswa) dataKelas.siswa = [];
                    if (!dataKelas.pertemuanList) dataKelas.pertemuanList = [];
                    if (!dataKelas.tanggal) dataKelas.tanggal = {};
                } else {
                    dataKelas = { pertemuanList: [], tanggal: {}, siswa: [] };
                }
                
                renderTabel();
            });
        } else {
            const key = `daftar_hadir_${kelasAktif}_${bulanAktif}`;
            const local = localStorage.getItem(key);
            if (local) {
                dataKelas = JSON.parse(local);
                if (!dataKelas.siswa) dataKelas.siswa = [];
                if (!dataKelas.pertemuanList) dataKelas.pertemuanList = [];
                if (!dataKelas.tanggal) dataKelas.tanggal = {};
            } else {
                dataKelas = { pertemuanList: [], tanggal: {}, siswa: [] };
            }
            renderTabel();
        }
    }

    function hapusSemuaDataKelas() {
        if (confirm(`Yakin ingin mengosongkan seluruh data untuk Kelas ${kelasAktif} pada Bulan ${bulanAktif}?`)) {
            dataKelas = { pertemuanList: [], tanggal: {}, siswa: [] };
            simpanKeDatabase();
        }
    }

    // Inisialisasi awal saat aplikasi dijalankan
    document.getElementById("setTanggalVal").valueAsDate = new Date();
    document.getElementById("selectBulan").value = bulanAktif;
    initHeaderListeners();
    muatDataKelasRealtime();
</script>

</body>
</html>
